site_name: NDMVR R3F
site_url: https://ndmspc.gitlab.io/ndmvr/docs
repo_name: ndmspc/ndmvr
repo_url: https://gitlab.com/ndmspc/ndmvr
edit_uri: edit/develop/docs/

nav:
  - "Home": index.md
  - "Architecture decisions":
      - "0001 - Shared interaction infrastructure": adr/0001-shared-interaction-infrastructure.md
  - "Demo": https://ndmspc.gitlab.io/ndmvr/
  - "Core library": https://ndmspc.gitlab.io/ndmvr-core/docs/
  - "User guide": https://ndmspc.gitlab.io/docs/

theme:
  variant: classic
  features:
    - toc.follow
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: lucide/sun
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - custom-skip-class-name
      auto_caption: true
      caption_position: bottom
      background: white
      shadow: true
  - macros

markdown_extensions:
  - admonition
  - footnotes
  - meta
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      toc_depth: 2
      permalink: true
      title: On this page
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
