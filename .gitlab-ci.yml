variables:
  PUBLIC_URL: "/ndmvr-r3f/"

stages:
  - build
  - deploy

test-prod:
  stage: build
  image: node:22
  script:
    - CI=true npm install
    - CI=true npm run build
    - CI=true npm run build-app
  except:
    - main
    - tags

deploy:
  stage: deploy
  image: node:22
  script:
    - "sed -i -e 's/^    \\\"version\\\".*/    \\\"version\\\": \\\"'${CI_COMMIT_REF_NAME/v/}'\\\",/g' package.json"
    - CI=true npm install
    - CI=true npm run build
    - npm config set //registry.npmjs.org/:_authToken ${NPM_AUTH_TOKEN}
    - CI=true npm publish --access public
  only:
    - tags

cache:
  key:
    files:
      - package-lock.json
    prefix: npm
  paths:
    - node_modules/

pages:
  stage: deploy
  image: node:22
  script:
    - CI=true npm install
    - CI=true npm run build -- -c vite.config.app.js --mode pages --base=$PUBLIC_URL
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  only:
    - main
