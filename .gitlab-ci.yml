variables:
  PUBLIC_URL: "/ndmvr/"
  IMAGE: node:24

image: ${IMAGE}

stages:
  - build
  - deploy

test-prod:
  stage: build
  tags:
    - ndmspc-hosted
  script:
    - CI=true npm install
    - sed -i 's/eval(/(0,eval)(/g' node_modules/jsroot/node_modules/three/examples/jsm/libs/lottie_canvas.module.js
    - CI=true npm run build
    - CI=true npm run build-app
  except:
    - main
    - tags

cache:
  key:
    files:
      - package-lock.json
    prefix: npm
  paths:
    - node_modules/

pages:
  stage: deploy
  image: registry.gitlab.com/ndmspc/docs/ndmspc-doc
  tags:
    - ndmspc-hosted
  variables:
    GIT_DEPTH: 0
  script:
    - mkdocs build -d public/docs
    - CI=true npm install
    - sed -i 's/eval(/(0,eval)(/g' node_modules/jsroot/node_modules/three/examples/jsm/libs/lottie_canvas.module.js
    - CI=true npm run build -- -c vite.config.app.js --mode pages --base=$PUBLIC_URL
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  # rules:
  #   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:
  stage: deploy
  tags:
    - gitlab-org-docker
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - "sed -i -e 's/^    \\\"version\\\".*/    \\\"version\\\": \\\"'${CI_COMMIT_REF_NAME/v/}'\\\",/g' package.json"
    - npm config set legacy-peer-deps=true
    # - npm install -g npm@latest
    - CI=true npm install
    - sed -i 's/eval(/(0,eval)(/g' node_modules/jsroot/node_modules/three/examples/jsm/libs/lottie_canvas.module.js
    - CI=true npm run build
    - export MY_VER_RELEASE=$(echo ${CI_COMMIT_REF_NAME/v/} | cut -sd '-' -f2)
    - if [ -z "$MY_VER_RELEASE" ];then CI=true npm publish --access public; fi
    - if [ -n "$MY_VER_RELEASE" ];then CI=true npm publish --access public --tag rc; fi
  only:
    - tags
