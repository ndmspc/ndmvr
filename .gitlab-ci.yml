variables:
  PUBLIC_URL: "/ndmvr-r3f/" # slash is important

image: node:22.11.0

stages:
  - build
  - deploy

cache:
  key:
    files:
      - package-lock.json
    prefix: npm
  paths:
    - node_modules/

pages:
  stage: deploy
  script:
    - npm install
    - npm run build -- --mode pages --base=$PUBLIC_URL
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
