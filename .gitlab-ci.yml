# One pipeline per push. Merge-request pipelines are switched off, so the branch
# pipeline is the merge gate. Tags publish the npm package and the packaged page.
#
# Only feature branches and `develop` get a pipeline. `main` and the
# `v<version>-patch` maintenance branches (v1.4-patch, ...) just receive merges
# that already passed in their source branch pipeline, and the published
# artifacts are built from `develop` (pages, release-next) or from tags, so
# running a pipeline there would only repeat work.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^v.*-patch$/
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

variables:
  PUBLIC_URL: "/ndmvr/" # slash is important
  IMAGE: node:24
  # Keep the npm download cache inside the project dir so the `cache:` block
  # below picks it up.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

stages:
  - build
  - deploy

# Gate job. Format and lint run first so a cheap oxfmt/oxlint finding fails
# before the expensive builds. On `develop` only format and lint run: the branch
# pipeline must already have passed, so the builds would duplicate
# `pages`/`release-next`. Tags only publish artifacts.
test:
  stage: build
  image: $IMAGE
  tags:
    - ndmspc-hosted
  script:
    - npm config set legacy-peer-deps=true
    - CI=true npm ci
    - sed -i 's/eval(/(0,eval)(/g' node_modules/jsroot/node_modules/three/examples/jsm/libs/lottie_canvas.module.js
    - CI=true npm run fmt:check
    - CI=true npm run lint
    - if [ -z "$SKIP_BUILD" ]; then CI=true npm run build && CI=true npm run build-app; fi
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: "$CI_COMMIT_BRANCH == 'develop'"
      variables:
        SKIP_BUILD: "1"
    - when: on_success

cache:
  key:
    files:
      - package-lock.json
    prefix: npm
  paths:
    - .npm/

pages:
  stage: deploy
  image: registry.gitlab.com/ndmspc/docs/ndmspc-doc
  tags:
    - ndmspc-hosted
  variables:
    GIT_DEPTH: 0
  script:
    - zensical build --clean --strict
    - mkdir -p public && mv site public/docs
    - npm config set legacy-peer-deps=true
    - CI=true npm ci
    - sed -i 's/eval(/(0,eval)(/g' node_modules/jsroot/node_modules/three/examples/jsm/libs/lottie_canvas.module.js
    - CI=true npm run build-app -- --mode pages --base=$PUBLIC_URL
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

publish:
  stage: deploy
  image: $IMAGE
  tags:
    - gitlab-org-docker
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - "sed -i -e 's/^  \\\"version\\\".*/  \\\"version\\\": \\\"'${CI_COMMIT_REF_NAME/v/}'\\\",/g' package.json"
    - npm config set legacy-peer-deps=true
    - CI=true npm ci
    - sed -i 's/eval(/(0,eval)(/g' node_modules/jsroot/node_modules/three/examples/jsm/libs/lottie_canvas.module.js
    - CI=true npm run build
    - export MY_VER_RELEASE=$(echo ${CI_COMMIT_REF_NAME/v/} | cut -sd '-' -f2)
    - if [ -z "$MY_VER_RELEASE" ];then CI=true npm publish --access public; fi
    - if [ -n "$MY_VER_RELEASE" ];then CI=true npm publish --access public --tag rc; fi
  only:
    - tags

# Builds the page for a tag and uploads it to the Generic Package Registry under
# the tag as its version, so a prebuilt page can be downloaded instead of
# running the npm builds again.
build-page:
  stage: deploy
  image: $IMAGE
  tags:
    - ndmspc-hosted
  script:
    - "sed -i -e 's/^  \\\"version\\\".*/  \\\"version\\\": \\\"'${CI_COMMIT_REF_NAME/v/}'\\\",/g' package.json"
    - npm config set legacy-peer-deps=true
    - CI=true npm ci
    - sed -i 's/eval(/(0,eval)(/g' node_modules/jsroot/node_modules/three/examples/jsm/libs/lottie_canvas.module.js
    - CI=true npm run build-app -- --mode pages --base=$PUBLIC_URL
    - tar -czf ndmvr-page.tar.gz -C dist .
    - |
      curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file ndmvr-page.tar.gz \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ndmvr-page/${CI_COMMIT_TAG}/ndmvr-page.tar.gz"
  only:
    - tags

# Creates the tag's GitLab Release and links the packaged page. The asset points
# at the package URL rather than a job artifact, so it never expires.
#
#   $CI_PROJECT_URL/-/releases/<tag>/downloads/ndmvr-page.tar.gz
#
# The release is created by calling glab ourselves rather than through the
# `release:` keyword: runner 19.4 passes an empty tag to glab there (the job runs
# on a tag, but glab logs `tag=` and fails with
# "cannot unmarshal array into Go value of type gitlab.Release"). Calling glab in
# `script:` hands it $CI_COMMIT_TAG directly, and GLAB_ENABLE_CI_AUTOLOGIN uses
# CI_JOB_TOKEN in the JOB-TOKEN header, which the Releases API accepts.
release-page:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags:
    - ndmspc-hosted
  needs:
    - build-page
  variables:
    GIT_STRATEGY: none # release is created via the API; no checkout needed
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GITLAB_HOST: "$CI_SERVER_HOST"
  script:
    - |
      set -eu
      test -n "${CI_COMMIT_TAG:-}" || { echo "release-page must run on a tag pipeline"; exit 1; }
      cat > /tmp/release-assets.json <<EOF
      [
        {
          "name": "ndmvr-page.tar.gz",
          "url": "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ndmvr-page/${CI_COMMIT_TAG}/ndmvr-page.tar.gz",
          "direct_asset_path": "/ndmvr-page.tar.gz",
          "link_type": "package"
        }
      ]
      EOF
      glab release create "$CI_COMMIT_TAG" \
        --repo "$CI_PROJECT_PATH" \
        --ref "$CI_COMMIT_SHA" \
        --name "NDMVR $CI_COMMIT_TAG" \
        --notes "Prebuilt NDMVR page ($CI_COMMIT_TAG). Extract and install as the web root." \
        --assets-links "$(cat /tmp/release-assets.json)"
  only:
    - tags

# Publishes the page built from `develop` to a single over-writable "next" slot
# in the Generic Package Registry. Each run deletes the previous "next" package
# first, so the download URL always serves the newest build:
#   $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ndmvr-page/next/ndmvr-page.tar.gz
release-next:
  stage: deploy
  image: $IMAGE
  tags:
    - ndmspc-hosted
  resource_group: release-next
  script:
    - "sed -i -e 's/^  \\\"version\\\".*/  \\\"version\\\": \\\"0.0.0-next.'${CI_PIPELINE_IID}'\\\",/g' package.json"
    - npm config set legacy-peer-deps=true
    - CI=true npm ci
    - sed -i 's/eval(/(0,eval)(/g' node_modules/jsroot/node_modules/three/examples/jsm/libs/lottie_canvas.module.js
    - CI=true npm run build-app -- --mode pages --base=$PUBLIC_URL
    - tar -czf ndmvr-page.tar.gz -C dist .
    # Drop the previous "next" package so the upload replaces it cleanly
    # (the registry would otherwise keep two files with the same name).
    - |
      PACKAGE_ID=$(node -e 'const [u,t]=process.argv.slice(1);fetch(u,{headers:{"JOB-TOKEN":t}}).then(r=>r.json()).then(l=>{const p=(l||[]).find(x=>x.name==="ndmvr-page"&&x.version==="next");if(p)console.log(p.id)})' \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_type=generic&package_name=ndmvr-page&package_version=next" \
        "${CI_JOB_TOKEN}")
      if [ -n "$PACKAGE_ID" ]; then
        curl --fail --silent --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PACKAGE_ID}"
      fi
    - |
      curl --fail --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file ndmvr-page.tar.gz \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ndmvr-page/next/ndmvr-page.tar.gz"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
